{% set name = "choreographer" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6c44a0e48e9b37977344d40bfa5a9ed88575fe4bc0fd836771bf702bc24d6884

build:
  number: 0
  skip: true  # [py<310]
  script:
    # Drop upstream's tests/ and results/ directories before pip install:
    # setuptools.find would otherwise pick them up as top-level packages.
    - rm -rf tests results  # [unix]
    - if exist tests rmdir /S /Q tests  # [win]
    - if exist results rmdir /S /Q results  # [win]
    - {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=65.0.0
    - wheel
    - setuptools-git-versioning
  run:
    - python
    - logistro >=2.0.1
    - platformdirs >=4.3.6
    - simplejson >=3.19.3

test:
  imports:
    - choreographer
  commands:
    - pip check
    - choreo_diagnose --help
    - choreo_get_chrome --help
  requires:
    - pip

about:
  home: https://github.com/plotly/choreographer
  summary: Browser remote-control library powering Kaleido image export.
  description: |
    choreographer allows remote control of browsers from Python. It was created
    to support image generation from browser-based charting tools (used by
    Plotly's Kaleido), but can be used for other purposes as well.
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  doc_url: https://github.com/plotly/choreographer
  dev_url: https://github.com/plotly/choreographer

extra:
  recipe-maintainers:
    - ytausch
